[project]
name = "navirag"
version = "0.1.0"
description = "NaviRAG - Hierarchical Reasoning-based RAG System"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0",
    "langgraph>=1.0.5",
    "langchain>=1.2.3",
    "langchain-openai>=0.3.0",
    "langchain-core>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
